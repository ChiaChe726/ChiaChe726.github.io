# Dependabot 的 PR 在 CI(build + 測試點)綠燈後自動合併,接著部署網站。
# patch／minor／major 都合:只要 build 與測試點通過就上線(使用者 2026-10-22 決定)。
#
# 為什麼改成 workflow_run(舊版用 pull_request_target + gh pr merge --auto):
#   - --auto 需要 main 有分支保護,本 repo 沒有,所以舊版每次都悄悄失敗,
#     2026-08 的 5 個 Dependabot PR 一個都沒合併。
#   - 這裡改成「CI 跑完而且成功」才觸發,直接合併,不需要分支保護。
#   - 用 --match-head-commit 確保合併的就是 CI 測過的那個 commit。
#   - 機器人合併不會觸發 deploy.yml 的 push 事件,所以合併後主動叫部署。
#
# 不自動合併的:更新 .github/workflows 的 PR(GITHUB_TOKEN 沒有改 workflow 的權限),
# 會在報告裡提示,留給你手動合併。
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: 找出 CI 測過的那個 Dependabot PR
        id: pr
        run: |
          pr=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,headRefOid,author \
                 --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and (.author.login == \"app/dependabot\" or .author.login == \"dependabot[bot]\")) | .number")
          if [ -z "$pr" ]; then
            echo "::notice::找不到對應的 Dependabot PR(可能已合併,或 PR 已有更新的 commit),略過。"
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: 合併
        id: merge
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          case "$HEAD_BRANCH" in
            dependabot/github_actions/*)
              echo "::warning::#$PR 更新的是 GitHub Actions(會改到 .github/workflows),GITHUB_TOKEN 不能合併,請手動合併。"
              exit 0 ;;
          esac
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: 部署
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run deploy.yml -R "$REPO" --ref main
